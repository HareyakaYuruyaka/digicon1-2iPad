<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Pouring Art - Pop'n Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pouring into the Display 2</h1>
    
    <div class="main-container">

        <div class="sidebar">
            
            <div class="step-section">
                <div class="step-label">Step 1</div>
                <h3>🎨 好きな色を入れる</h3>
                <div class="popn-wrapper">
                    <div class="popn-base">
                        <button class="color-btn popn-btn bottom-row" data-color="#FF0000" style="--btn-color: #FF0000;"></button>
                        <button class="color-btn popn-btn top-row"    data-color="#FFFF00" style="--btn-color: #FFFF00;"></button>
                        <button class="color-btn popn-btn bottom-row" data-color="#00FF00" style="--btn-color: #00FF00;"></button>
                        <button class="color-btn popn-btn top-row"    data-color="#0000FF" style="--btn-color: #0000FF;"></button>
                        <button class="color-btn popn-btn bottom-row" data-color="#FFFFFF" style="--btn-color: #FFFFFF;"></button>
                        <button class="color-btn popn-btn top-row"    data-color="#00FFFF" style="--btn-color: #00FFFF;"></button>
                        <button class="color-btn popn-btn bottom-row" data-color="#FF00FF" style="--btn-color: #FF00FF;"></button>
                    </div>
                </div>
                <div id="cup-ui">
                    <div id="cupVisual" title="コップの中身"></div>
                </div>
            </div>

            <div class="step-section">
                <div class="step-label">Step 2</div>
                <button id="pourFromCupButton" class="action-btn primary-btn">
                    <span class="btn-icon">💧</span> 準備OK！コップから流す
                </button>
            </div>

            <div class="step-section instruction-box">
                <div class="step-label">Step 3</div>
                <p>キャンバスをタッチして<br>iPadを傾けて描こう！📱</p>
            </div>

            <div class="sub-controls">
                <button id="resetButton" class="action-btn danger-btn">🗑️ 最初からやり直す</button>
                <button id="saveImageButton" class="action-btn success-btn">📸 画像を保存・共有</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-stack">
                <canvas id="permanentCanvas"></canvas>
                <canvas id="particleCanvas"></canvas>
            </div>
        </div>

    </div>
    
    <div id="saveOverlay" class="save-overlay" aria-hidden="true">
        <div class="save-overlay-backdrop"></div>
        <div class="save-overlay-content">
            <button id="closeSaveOverlay" class="close-overlay">✕</button>

            <div id="qrContainer" class="qr-container"></div>

            <div id="saveActions" class="save-actions">
                <button id="shareToPhoneButton" class="action-btn success-btn">スマホに送る（AirDrop / 共有）</button>
                <button id="regenQrButton" class="action-btn">QRをさらに圧縮して生成</button>
                <p id="saveStatus" style="font-size:13px;color:#444;margin-top:8px;"></p>
                <p id="airdropHint" class="airdrop-hint">AirDropで受け取るには：来場者のiPhoneで「AirDropを受信する」に設定し、この端末の「スマホに送る」をタップ → 来場者のiPhone名を選んで受信してください。受信後、写真アプリで保存できます。</p>
            </div>

            <div id="fallbackArea" class="fallback-area">
                <p>QRに収まらない画像は、以下で直接ダウンロードしてください。</p>
                <img id="previewImage" alt="キャンバスプレビュー">
                <a id="downloadLink" download="pouring.png">画像をダウンロード</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
